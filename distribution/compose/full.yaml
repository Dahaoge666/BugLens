services:
  buglens-backend:
    image: ${BUGLENS_BACKEND_IMAGE:-ghcr.io/dahaoge666/buglens-backend:${BUGLENS_VERSION:-0.1.0}}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      BUGLENS_SESSION_DB: /var/lib/buglens/buglens.db
      BUGLENS_CONFIG: /var/lib/buglens/config.yaml
      BUGLENS_TRACING: ${BUGLENS_TRACING:-true}
      BUGLENS_CORS_ORIGIN: ${BUGLENS_CORS_ORIGIN:-}
      BUGLENS_ADMIN_TOKEN: ${BUGLENS_ADMIN_TOKEN:-}
    volumes:
      - "${BUGLENS_DATA_DIR:-./data}:/var/lib/buglens"
    command: ["--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/admin/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  buglens-frontend:
    image: ${BUGLENS_FRONTEND_IMAGE:-ghcr.io/dahaoge666/buglens-frontend:${BUGLENS_VERSION:-0.1.0}}
    restart: unless-stopped
    depends_on:
      buglens-backend:
        condition: service_healthy
    ports:
      - "${BUGLENS_WEB_PORT:-8080}:80"
