[project]
name = "buglens-file-logs-plugin"
version = "1.0.0"
description = "Read-only local text and JSON Lines log plugin for BugLens"
requires-python = ">=3.11"
license = "MIT"
license-files = []
dependencies = [
  "buglens-plugin-api>=1,<2",
]

[project.entry-points."buglens.tool_plugins"]
file_logs = "buglens_file_logs_plugin:plugin_factory"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buglens_file_logs_plugin*"]
