[project]
name = "buglens"
version = "0.1.0"
description = "A deterministic, evidence-bound diagnosis agent graph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0.14,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
