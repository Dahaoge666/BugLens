# Optional external-data catalog.  Install the reference plugin wheels before
# enabling the corresponding instances:
#   uv pip install buglens-sqlite-plugin buglens-file-logs-plugin
config_version: environments-v1

plugin_instances:
  sqlite-local:
    plugin_id: sqlite
    enabled: true
    config:
      root_path: data/environments
    default_limits:
      max_results: 200
      timeout_seconds: 10
      max_bytes: 65536
  file-logs-local:
    plugin_id: file_logs
    enabled: true
    config:
      root_path: data/logs
      encodings: [utf-8, utf-8-sig, latin-1]
    default_limits:
      max_results: 200
      timeout_seconds: 10
      max_bytes: 65536
      max_scan_files: 100
      max_scan_bytes: 16777216

  # Declarative connectors reuse the same Agent-facing capability tools and
  # do not require a Python plugin wheel. Uncomment one and bind a source below.
  # knowledge-mcp:
  #   plugin_id: vendor-knowledge
  #   transport:
  #     type: mcp
  #     url: https://knowledge.example/mcp
  #     tool_map: {search_knowledge: search}
  #     credentials_ref: secret://buglens/knowledge
  # traffic-cli:
  #   plugin_id: vendor-traffic
  #   transport:
  #     type: cli
  #     command: /opt/buglens/bin/traffic-connector
  #     args: [--stdio]
  # traffic-ssh:
  #   plugin_id: vendor-traffic-ssh
  #   transport:
  #     type: ssh
  #     host: probe-01.example
  #     user: buglens
  #     known_hosts: /etc/buglens/known_hosts
  #     identity_file: /etc/buglens/probe_ed25519
  #     remote_command: /opt/buglens/bin/traffic-probe

environments:
  staging:
    display_name: Staging
    aliases: [stage, 预发布]
    level: non-production
    region: cn-east-1
    timezone: Asia/Shanghai
    tags: {deployment.environment.name: staging}
  production:
    display_name: Production
    aliases: [prod, 线上]
    level: production
    region: cn-east-1
    timezone: Asia/Shanghai
    tags: {deployment.environment.name: production}

services:
  order-api-staging:
    name: order-api
    aliases: [orders]
    version: 2.4.1
    environment_id: staging
  order-api-production:
    name: order-api
    aliases: [orders]
    version: 2.4.1
    environment_id: production

nodes:
  order-staging-1:
    hostname: order-staging-1
    instance_id: order-api-staging-1
    environment_id: staging
  order-production-1:
    hostname: order-production-1
    instance_id: order-api-production-1
    environment_id: production

sources:
  staging-orders-db:
    kind: database
    capabilities: [database.describe.v1, database.query.v1]
    plugin_instance_id: sqlite-local
    environment_id: staging
    service_ids: [order-api-staging]
    config:
      path: staging.sqlite
      allowed_tables: [orders, order_events]
      denied_columns: [payment_token]
  production-orders-db:
    kind: database
    capabilities: [database.describe.v1, database.query.v1]
    plugin_instance_id: sqlite-local
    environment_id: production
    service_ids: [order-api-production]
    config:
      path: production.sqlite
      allowed_tables: [orders, order_events]
      denied_columns: [payment_token]
  staging-order-logs:
    kind: logs
    capabilities: [logs.search.v1]
    plugin_instance_id: file-logs-local
    environment_id: staging
    service_ids: [order-api-staging]
    node_ids: [order-staging-1]
    config:
      paths: [staging/order-api.log]
  production-order-logs:
    kind: logs
    capabilities: [logs.search.v1]
    plugin_instance_id: file-logs-local
    environment_id: production
    service_ids: [order-api-production]
    node_ids: [order-production-1]
    config:
      paths: [production/order-api.log]

