profiles:
  default:
    config_version: sqlite-demo-v1
    prompt_config_version: tenant-prompts-v1
    models:
      default:
        model: gpt-4.1-mini
    graph:
      max_investigation_attempts: 2
      max_clarification_rounds: 2
    evaluation:
      passing_score: 75
      min_evidence_traceability: 15
      min_verification_executability: 15
      rubric_version: rubric-v1
    nodes:
      analyze: {model: default, max_turns: 6, prompt_version: analyzer-v1}
      investigate: {model: default, max_turns: 6, prompt_version: tenant-prompts-v1}
      evaluate: {model: default, max_turns: 6, prompt_version: rubric-v1}
      summarize: {model: default, max_turns: 6, prompt_version: summary-v1}
    tools:
      enabled: true
      allowed_nodes: [investigate]
      allowed_profiles: [default]
      max_results: 20
      max_result_rows: 200
      timeout_seconds: 30
      max_calls_per_run: 20
      max_concurrent_calls: 2
    retry:
      max_retries: 5
      initial_delay_seconds: 1
      max_delay_seconds: 16
      multiplier: 2
      jitter: true
    sessions:
      history_item_limit: 100
    lease_seconds: 60
    lease_renewal_seconds: 20
