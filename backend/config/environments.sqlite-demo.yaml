config_version: environments-v1

plugin_instances:
  sqlite-local:
    plugin_id: sqlite
    enabled: true
    config:
      root_path: data/environments
      health_path: staging.sqlite
    default_limits:
      max_results: 200
      timeout_seconds: 10
      max_bytes: 65536

environments:
  staging:
    display_name: 预发布环境
    aliases: [stage, staging, 预发布]
    level: non-production
    region: cn-east-1
    timezone: Asia/Shanghai
    tags: {deployment.environment.name: staging}
  production:
    display_name: 生产环境
    aliases: [prod, production, 线上]
    level: production
    region: cn-east-1
    timezone: Asia/Shanghai
    tags: {deployment.environment.name: production}

services:
  order-api-staging:
    name: order-api
    aliases: [orders]
    version: 2.4.1
    environment_id: staging
  order-api-production:
    name: order-api
    aliases: [orders]
    version: 2.4.1
    environment_id: production

nodes:
  order-staging-1:
    hostname: order-staging-1
    instance_id: order-api-staging-1
    environment_id: staging
  order-production-1:
    hostname: order-production-1
    instance_id: order-api-production-1
    environment_id: production

sources:
  staging-orders-db:
    kind: database
    plugin_instance_id: sqlite-local
    environment_id: staging
    service_ids: [order-api-staging]
    config:
      path: staging.sqlite
      allowed_tables: [orders, order_events]
      denied_columns: [payment_token]
  production-orders-db:
    kind: database
    plugin_instance_id: sqlite-local
    environment_id: production
    service_ids: [order-api-production]
    config:
      path: production.sqlite
      allowed_tables: [orders, order_events]
      denied_columns: [payment_token]
