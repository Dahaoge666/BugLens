[project]
name = "buglens"
version = "0.1.0"
description = "An evidence-bound diagnosis service using the OpenAI Agents SDK loop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = []
authors = [{ name = "Dahaoge666" }]
keywords = ["diagnosis", "agents", "openai", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "openai-agents>=0.22,<0.23",
  "cryptography>=42,<47",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "buglens-plugin-api>=1,<2",
  "jsonschema>=4.20,<5",
]

[project.urls]
Repository = "https://github.com/Dahaoge666/BugLens"

[project.scripts]
buglens = "app.cli:main"
buglens-web = "app.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
buglens-plugin-api = { path = "../plugin-api" }

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
web = [
  "uvicorn>=0.30,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
